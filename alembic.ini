[alembic]
# %(here)s 是 alembic.ini 所在目录（项目根目录）。
# 使用 %(here)s 而非相对路径，使 `alembic -c /path/to/alembic.ini upgrade head`
# 从任意工作目录执行都能正确定位迁移脚本并导入 app 包。
script_location = %(here)s/alembic
prepend_sys_path = %(here)s
path_separator = os
# 数据库 URL 由 env.py 从应用配置读取，此处留空
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S