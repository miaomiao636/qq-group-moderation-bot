[alembic]
# %(here)s is the directory containing this alembic.ini (project root).
# Use %(here)s instead of relative paths so that
# `alembic -c /path/to/alembic.ini upgrade head` works from any CWD.
# NOTE: keep this file ASCII-only; configparser decodes it with the
# platform locale encoding (e.g. cp1252 on Windows).
script_location = %(here)s/alembic
prepend_sys_path = %(here)s
path_separator = os
# Database URL is read from application settings in env.py; left empty here.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S