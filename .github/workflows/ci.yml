name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Lint, Type-check & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      # Windows runner 默认 locale 是 cp1252，强制 UTF-8 模式，
      # 避免 configparser 等按本地编码读 UTF-8 文件时报 UnicodeDecodeError。
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"

      - name: Install dependencies (locked)
        run: uv sync --locked --all-groups

      - name: Lint (ruff check)
        run: uv run ruff check app tests alembic

      - name: Format check (ruff format)
        run: uv run ruff format --check app tests alembic

      - name: Type check (mypy)
        run: uv run mypy app

      - name: Test (pytest)
        run: uv run pytest

  runtime-deps:
    name: Runtime deps regression (clean install)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"

      # 回归检查：仅安装运行时依赖（不带 dev 组），验证应用可导入。
      # 若运行时依赖被误放入 dev 组（如 aiosqlite），此步骤会失败，
      # 防止"测试通过但干净生产环境无法启动"的回归。
      #
      # 注意：`uv run` 默认会自动重新同步项目环境（含 dev 组），
      # 因此必须使用 `--no-sync` 阻止自动重装，否则 dev 依赖会被悄悄装回，
      # 使本回归检查失效。不要使用 `--no-project`，它会脱离项目 venv。
      - name: Install runtime deps only (no dev group)
        run: uv sync --locked --no-dev

      - name: Verify app imports with runtime deps only
        run: uv run --no-sync python -c "from app.main import app; print('runtime import OK')"

      # 反向断言：dev 组依赖（pytest）在干净运行时环境中必须不存在。
      # 若 pytest 可导入，说明 dev 依赖被误装回，回归检查失败。
      - name: Assert dev deps are NOT installed
        run: |
          if uv run --no-sync python -c "import pytest" 2>/dev/null; then
            echo "FAIL: dev 依赖 pytest 被误装回运行时环境"
            exit 1
          fi
          echo "OK: dev 依赖未安装，运行时环境干净"
